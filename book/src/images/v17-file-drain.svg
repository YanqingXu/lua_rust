<svg xmlns="http://www.w3.org/2000/svg" width="900" height="704" viewBox="0 0 900 704" role="img" aria-labelledby="title desc">
  <title id="title">Vm Drop 中的文件 drain 与 Heap shutdown 顺序</title>
  <desc id="desc">正确 Drop 先 files.clear 释放所有 Some File 和移除 None，再 Heap shutdown，然后自定义 Drop body 退出，最后 Rust 自动析构字段。固定故障只 shutdown，因此在 shutdown 和 Drop body 退出观察点仍持有 File，但字段自动析构后也释放，不是永久泄漏。Heap shutdown 不运行 Lua finalizers，Drop 不报告 close 错误或承诺 fsync。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#286047"/></marker><style>
    text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#20352b}.head{font-size:22px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.mono{font-family:Consolas,'Microsoft YaHei',monospace;font-size:17px}.flow{fill:none;stroke:#286047;stroke-width:2;marker-end:url(#arrow)}
  </style></defs>
  <rect width="900" height="704" rx="16" fill="#fbfaf4"/>
  <text x="24" y="38" class="head">VM owner 结束时，明确安排宿主资源与 Heap 的结束顺序</text>
  <text x="44" y="79" class="label">参考：先 drain</text><text x="484" y="79" class="label">固定故障：只 shutdown</text>
  <rect x="24" y="96" width="410" height="102" rx="12" fill="#edf6ed" stroke="#286047"/>
  <text x="44" y="129" class="mono">files.clear()</text><text x="44" y="161" class="small">Some(File) 全部析构，None 直接移除。</text><text x="44" y="185" class="small">即使 Lua 全局仍引用 userdata，也结束 owner。</text>
  <rect x="464" y="96" width="412" height="102" rx="12" fill="#fff1ee" stroke="#b55b48"/>
  <text x="484" y="129" class="mono">跳过 files.clear()</text><text x="484" y="161" class="small">两个 Some(File) 仍由字段 map 持有。</text><text x="484" y="185" class="small">此处只能观察释放顺序不同。</text>
  <path d="M229 198V230" class="flow"/><path d="M670 198V230" class="flow"/>
  <rect x="24" y="234" width="410" height="92" rx="12" fill="#eef5ff" stroke="#52769f"/>
  <text x="44" y="267" class="mono">heap.shutdown()</text><text x="44" y="302" class="label">观察点：0 个 File owner</text>
  <rect x="464" y="234" width="412" height="92" rx="12" fill="#fff1ee" stroke="#b55b48"/>
  <text x="484" y="267" class="mono">heap.shutdown()</text><text x="484" y="302" class="label">观察点：仍有 2 个 File owner</text>
  <path d="M229 326V358" class="flow"/><path d="M670 326V358" class="flow"/>
  <rect x="24" y="362" width="852" height="86" rx="12" fill="#f1edf7" stroke="#75519a"/>
  <text x="44" y="395" class="label">自定义 Drop body 退出 → Rust 自动析构结构体字段</text>
  <text x="44" y="429" class="small">参考的 map 已空；故障路径的 map 此时也会析构 File。整个 owner 销毁后两者均为 0。</text>
  <path d="M450 448V480" class="flow"/>
  <rect x="24" y="484" width="852" height="82" rx="12" fill="#fff" stroke="#286047"/>
  <text x="44" y="517" class="label">真实 Vm：作用域内留全局 open file → 作用域结束 → 独占重开并实读</text>
  <text x="44" y="548" class="small">Windows share_mode(0) 先失败后成功；模型 trace 另证明 shutdown 前的 drain 顺序。</text>
  <rect x="24" y="590" width="852" height="70" rx="12" fill="#fff" stroke="#286047"/>
  <text x="44" y="619" class="small">Heap::shutdown 清 objects / GC 队列 / pending finalizers，不执行 Lua callback。</text>
  <text x="44" y="647" class="small">Drop 不报告关闭错误，不承诺 flush/fsync 或 process exit/abort 清理。</text>
  <text x="24" y="687" class="small">验收应同时检查 Drop body 内的顺序，以及整个 owner 结束后的真实资源释放。</text>
</svg>
