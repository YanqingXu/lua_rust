<svg xmlns="http://www.w3.org/2000/svg" width="900" height="740" viewBox="0 0 900 740" role="img" aria-labelledby="title desc">
<title id="title">Session与当前输入的所有权及执行边界</title><desc id="desc">Repl借用同一Session，拥有source与pending诊断。每次重新编译完整buffer，NeedMoreInput零执行并保留，成功执行一次再清，普通错误清source但保留Session与已有副作用。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#286047"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#20352b}.head{font-size:22px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.mono{font-family:Consolas,'Microsoft YaHei',monospace;font-size:17px}.flow{fill:none;stroke:#286047;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="900" height="740" rx="16" fill="#fbfaf4"/>
<text x="24" y="38" class="head">保留输入不等于先执行前缀；完成后的 chunk 只执行一次</text>
<rect x="24" y="64" width="408" height="98" rx="12" fill="#eef5ff" stroke="#52769f"/>
<text x="44" y="98" class="mono">Session owns VM / Heap / globals</text>
<text x="44" y="130" class="small">跨已完成 chunks 保存同一个运行时。</text>
<text x="44" y="154" class="small">不因普通错误重建 owner。</text>
<rect x="456" y="64" width="420" height="98" rx="12" fill="#f1edf7" stroke="#75519a"/>
<text x="476" y="98" class="mono">Repl&lt;'a&gt; borrows &amp;mut Session</text>
<text x="476" y="130" class="small">owns source + Option&lt;CompileError&gt;</text>
<text x="476" y="154" class="small">pending 诊断只属于当前输入。</text>
<path d="M456 110H432" class="flow"/>
<rect x="24" y="196" width="852" height="86" rx="12" fill="#edf6ed" stroke="#286047"/>
<text x="44" y="228" class="label">真实行 / 最后无 LF 片段 → 当前 source → Session.execute_multi</text>
<text x="44" y="258" class="small">空闲空行忽略；只在空闲时改写单个 =；新片段到来后重新编译整个 buffer。</text>
<path d="M150 282V320" class="flow"/>
<path d="M438 282V320" class="flow"/>
<path d="M738 282V320" class="flow"/>
<rect x="24" y="324" width="252" height="138" rx="12" fill="#f1edf7" stroke="#75519a"/>
<text x="44" y="358" class="label">NeedMoreInput</text>
<text x="44" y="390" class="small">没有 Proto，零执行。</text>
<text x="44" y="420" class="small">保留 source，更新诊断。</text>
<text x="44" y="450" class="small">下一提示符 &gt;&gt;</text>
<rect x="300" y="324" width="276" height="138" rx="12" fill="#edf6ed" stroke="#286047"/>
<text x="320" y="358" class="label">compile Ok → VM 一次</text>
<text x="320" y="390" class="small">返回 Values；清 source。</text>
<text x="320" y="420" class="small">pending=None。</text>
<text x="320" y="450" class="small">下一提示符 &gt;</text>
<rect x="600" y="324" width="276" height="138" rx="12" fill="#fff1ee" stroke="#b55b48"/>
<text x="620" y="358" class="label">Invalid / runtime Err</text>
<text x="620" y="390" class="small">清 source + pending。</text>
<text x="620" y="420" class="small">显示错误，继续 &gt;。</text>
<text x="620" y="450" class="small">已有副作用不回滚。</text>
<rect x="24" y="496" width="852" height="106" rx="12" fill="#eef5ff" stroke="#52769f"/>
<text x="44" y="530" class="mono">effects=0 → effects=effects+1; if true then → … → end</text>
<text x="44" y="562" class="small">块内再加 effects=effects+10；未完成时零执行，end 后整块一次，effects=11。</text>
<text x="44" y="590" class="small">不要先 execute 探测成功，再 execute 同一段 source；那会重复副作用。</text>
<rect x="24" y="628" width="852" height="68" rx="12" fill="#fff" stroke="#286047"/>
<text x="44" y="660" class="small">每次重编译完整 buffer，不是增量 parser；成功路径没有额外探测性执行。</text>
<text x="44" y="686" class="small">EOF 只消费 pending 诊断；不在结束时重新运行 source。</text>
<text x="24" y="722" class="small">验收：真实 Session 读回字段 / 计数、普通错误后恢复、完整 stdout/stderr 与 exit code。</text>
</svg>
