<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc">
<title id="title">格式游标、参数游标和错误返回边界</title><desc id="desc">dispatcher先区分literal、双百分号和转换项，前两者不消费参数。转换项先检查参数存在，再解析规格，然后检查类型并渲染，成功才提交结果和游标。错误返回且不发布半成品。教学consume只展示单参数类型验证和游标提交。官方对照用Lua层hex编码内部bytes，捕获raw ASCII和after哨兵。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#286047"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#20352b}.head{font-size:22px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.mono{font-family:Consolas,'Microsoft YaHei',monospace;font-size:17px}.flow{fill:none;stroke:#286047;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="900" height="1000" rx="16" fill="#fbfaf4"/>
<text x="24" y="38" class="head">两个游标各司其职：不是每个百分号都要拿下一个参数</text>
<rect x="24" y="64" width="852" height="72" rx="12" fill="#eef5ff" stroke="#52769f"/>
<text x="44" y="98" class="label">格式参数 #1：检查缺参 / 类型，字符串或数字可进入字节解析</text><text x="44" y="124" class="small">format cursor 扫描 bytes；argument cursor 指向下一项，错误仍按 Lua 参数号报告。</text>
<path d="M170 136V174" class="flow"/><path d="M450 136V174" class="flow"/><path d="M730 136V174" class="flow"/>
<rect x="24" y="178" width="268" height="112" rx="12" fill="#edf6ed" stroke="#286047"/>
<text x="44" y="212" class="label">普通字节</text><text x="44" y="244" class="small">追加字节，format cursor +1。</text><text x="44" y="274" class="small">argument cursor 不动。</text>
<rect x="316" y="178" width="268" height="112" rx="12" fill="#edf6ed" stroke="#286047"/>
<text x="336" y="212" class="label">%%</text><text x="336" y="244" class="small">追加 %，format cursor +2。</text><text x="336" y="274" class="small">argument cursor 不动。</text>
<rect x="608" y="178" width="268" height="112" rx="12" fill="#f1edf7" stroke="#75519a"/>
<text x="628" y="212" class="label">其它 % 项</text><text x="628" y="244" class="small">先检查当前参数是否存在。</text><text x="628" y="274" class="small">缺参优先于非法规格。</text>
<path d="M738 290V326H450V348" class="flow"/>
<rect x="24" y="352" width="852" height="72" rx="12" fill="#eef5ff" stroke="#52769f"/>
<text x="44" y="386" class="label">parse_spec → FormatSpec，再按转换项检查类型与范围</text><text x="44" y="412" class="small">d/i/f 要数值；s/q 要 string 或 number；table / boolean 不因 stringify 而合法。</text>
<path d="M235 424V462" class="flow"/><path d="M665 424V462" class="flow"/>
<rect x="24" y="466" width="408" height="132" rx="12" fill="#edf6ed" stroke="#286047"/>
<text x="44" y="500" class="label">成功：渲染一个 item</text><text x="44" y="534" class="small">追加 item，再提交两个游标。</text><text x="44" y="564" class="small">最终 Ok(Vec&lt;u8&gt;) 才返回 Lua。</text><text x="44" y="590" class="small">格式化中没有对外 io.write。</text>
<rect x="456" y="466" width="420" height="132" rx="12" fill="#fff1ee" stroke="#b55b48"/>
<text x="476" y="500" class="label">失败：Err → VM 错误 → pcall</text><text x="476" y="534" class="small">保留参数号与错误类别。</text><text x="476" y="564" class="small">局部 output 丢弃，不发布半成品。</text><text x="476" y="590" class="small">不表示回滚 VM 先前副作用。</text>
<rect x="24" y="632" width="852" height="104" rx="12" fill="#f1edf7" stroke="#75519a"/>
<text x="44" y="666" class="label">练习投影：consume(spec, values, &amp;mut cursor)</text><text x="44" y="698" class="small">真实 parser 给 spec，Args 给类型检查；成功后 cursor +1，失败保持原值。</text><text x="44" y="726" class="small">该 hook 练参数提交边界；真实 VM 的数值渲染、NUL 与输出另做验收。</text>
<rect x="24" y="770" width="852" height="136" rx="12" fill="#eef5ff" stroke="#52769f"/>
<text x="44" y="804" class="label">官方字节对照：在 Lua 内将内部结果编码成 ASCII hex</text><text x="44" y="836" class="mono">ok|&lt;value_hex&gt;|after    或    error|after</text><text x="44" y="868" class="small">编码器不用 string.format；捕获完整 stdout / stderr / exit，不改 CRLF。</text><text x="44" y="896" class="small">%q 的实际 LF、NUL、0xff 因此都可观察；本地测试再核错误 kind / 参数号。</text>
<text x="24" y="944" class="small">pcall 捕获错误后仍到 after；未知 case、driver 编译错误或宿主故障不能冒充通过。</text>
<text x="24" y="974" class="small">只证明固定 case 的有界合同；完整 format、pattern、dump 仍属于 LUA51-D005 partial。</text>
</svg>
