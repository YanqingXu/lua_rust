[package]
name = "lua_app"
version = "0.14.0"
edition = "2021"
publish = false

[dependencies]
lua_compiler = { path = "crates/lua_compiler" }
lua_core = { path = "crates/lua_core" }
lua_vm = { path = "crates/lua_vm" }

[workspace]
resolver = "2"
members = [
    ".",
    "crates/lua_core",
    "crates/lua_compiler",
    "crates/lua_vm",
]

[lints.clippy]
all = "warn"

[[test]]
name = "gc_exercises"
path = "exercises/acceptance.rs"

[[test]]
name = "gc_reference"
path = "exercises/reference.rs"

[[test]]
name = "gc_borrow_exercises"
path = "exercises/borrow/acceptance.rs"

[[test]]
name = "gc_borrow_reference"
path = "exercises/borrow/reference.rs"

[[test]]
name = "gc_callbacks_exercises"
path = "exercises/callbacks/acceptance.rs"

[[test]]
name = "gc_callbacks_reference"
path = "exercises/callbacks/reference.rs"
