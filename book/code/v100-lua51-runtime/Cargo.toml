[package]
name = "lua_app"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
lua_compiler = { path = "crates/lua_compiler" }
lua_core = { path = "crates/lua_core" }
lua_vm = { path = "crates/lua_vm" }
lua_bytecode = { path = "crates/lua_bytecode" }
lua_stdlib = { path = "crates/lua_stdlib" }

[workspace]
resolver = "2"
members = [
    ".",
    "crates/lua_core",
    "crates/lua_compiler",
    "crates/lua_vm",
    "crates/lua_stdlib",
    "crates/lua_bytecode",
]

[lints.clippy]
all = "warn"

[[test]]
name = "repl_migration_exercises"
path = "exercises/repl_migration/acceptance.rs"

[[test]]
name = "repl_migration_reference"
path = "exercises/repl_migration/reference.rs"

[[test]]
name = "string_format_exercises"
path = "exercises/string_format/acceptance.rs"

[[test]]
name = "string_format_reference"
path = "exercises/string_format/reference.rs"

[[test]]
name = "string_find_exercises"
path = "exercises/string_find/acceptance.rs"

[[test]]
name = "string_find_reference"
path = "exercises/string_find/reference.rs"

[[test]]
name = "string_find_captures_exercises"
path = "exercises/string_find_captures/acceptance.rs"

[[test]]
name = "string_find_captures_reference"
path = "exercises/string_find_captures/reference.rs"
