[package]
name = "lua_app"
version = "0.18.0"
edition = "2021"
publish = false

[dependencies]
lua_compiler = { path = "crates/lua_compiler" }
lua_core = { path = "crates/lua_core" }
lua_vm = { path = "crates/lua_vm" }
lua_bytecode = { path = "crates/lua_bytecode" }

[workspace]
resolver = "2"
members = [
    ".",
    "crates/lua_core",
    "crates/lua_compiler",
    "crates/lua_vm",
    "crates/lua_stdlib",
    "crates/lua_bytecode",
]

[lints.clippy]
all = "warn"

[[test]]
name = "cli_exit_exercises"
path = "exercises/cli_exit/acceptance.rs"

[[test]]
name = "cli_exit_reference"
path = "exercises/cli_exit/reference.rs"

[[test]]
name = "repl_owner_exercises"
path = "exercises/repl_owner/acceptance.rs"

[[test]]
name = "repl_owner_reference"
path = "exercises/repl_owner/reference.rs"

[[test]]
name = "repl_recovery_exercises"
path = "exercises/repl_recovery/acceptance.rs"

[[test]]
name = "repl_recovery_reference"
path = "exercises/repl_recovery/reference.rs"

[[test]]
name = "bytecode_json_exercises"
path = "exercises/bytecode_json/acceptance.rs"

[[test]]
name = "bytecode_json_reference"
path = "exercises/bytecode_json/reference.rs"

[[test]]
name = "bytecode_cfg_exercises"
path = "exercises/bytecode_cfg/acceptance.rs"

[[test]]
name = "bytecode_cfg_reference"
path = "exercises/bytecode_cfg/reference.rs"

[[test]]
