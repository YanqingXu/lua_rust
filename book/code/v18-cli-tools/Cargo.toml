[package]
name = "lua_app"
version = "0.18.0"
edition = "2021"
publish = false
default-run = "lua_app"

[[bin]]
name = "runner_fixture"
path = "exercises/runner_support/fixture.rs"

[dependencies]
lua_compiler = { path = "crates/lua_compiler" }
lua_core = { path = "crates/lua_core" }
lua_vm = { path = "crates/lua_vm" }
lua_bytecode = { path = "crates/lua_bytecode" }

[workspace]
resolver = "2"
members = [
    ".",
    "crates/lua_core",
    "crates/lua_compiler",
    "crates/lua_vm",
    "crates/lua_stdlib",
    "crates/lua_bytecode",
]

[lints.clippy]
all = "warn"

[[test]]
name = "cli_exit_exercises"
path = "exercises/cli_exit/acceptance.rs"

[[test]]
name = "cli_exit_reference"
path = "exercises/cli_exit/reference.rs"

