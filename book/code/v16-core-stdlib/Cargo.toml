[package]
name = "lua_app"
version = "0.16.0"
edition = "2021"
publish = false

[dependencies]
lua_compiler = { path = "crates/lua_compiler" }
lua_core = { path = "crates/lua_core" }
lua_vm = { path = "crates/lua_vm" }

[workspace]
resolver = "2"
members = [
    ".",
    "crates/lua_core",
    "crates/lua_compiler",
    "crates/lua_vm",
    "crates/lua_stdlib",
]

[lints.clippy]
all = "warn"

[dev-dependencies]
lua_stdlib = { path = "crates/lua_stdlib" }

[[test]]
name = "args_exercises"
path = "exercises/args/acceptance.rs"

[[test]]
name = "args_reference"
path = "exercises/args/reference.rs"

[[test]]
name = "catalog_exercises"
path = "exercises/catalog/acceptance.rs"

[[test]]
name = "catalog_reference"
path = "exercises/catalog/reference.rs"

[[test]]
name = "globals_exercises"
path = "exercises/globals/acceptance.rs"

[[test]]
name = "globals_reference"
path = "exercises/globals/reference.rs"
