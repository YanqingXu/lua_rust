[package]
name = "lua_app"
version = "0.17.0"
edition = "2021"
publish = false

[dependencies]
lua_compiler = { path = "crates/lua_compiler" }
lua_core = { path = "crates/lua_core" }
lua_vm = { path = "crates/lua_vm" }

[workspace]
resolver = "2"
members = [
    ".",
    "crates/lua_core",
    "crates/lua_compiler",
    "crates/lua_vm",
    "crates/lua_stdlib",
]

[lints.clippy]
all = "warn"

[[test]]
name = "cache_exercises"
path = "exercises/cache/acceptance.rs"

[[test]]
name = "cache_reference"
path = "exercises/cache/reference.rs"

[[test]]
name = "cycles_exercises"
path = "exercises/cycles/acceptance.rs"

[[test]]
name = "cycles_reference"
path = "exercises/cycles/reference.rs"

[[test]]
name = "retry_exercises"
path = "exercises/retry/acceptance.rs"

[[test]]
name = "retry_reference"
path = "exercises/retry/reference.rs"

[[test]]
name = "file_close_exercises"
path = "exercises/file_close/acceptance.rs"

[[test]]
name = "file_close_reference"
path = "exercises/file_close/reference.rs"

[[test]]
name = "file_prune_exercises"
path = "exercises/file_prune/acceptance.rs"

[[test]]
name = "file_prune_reference"
path = "exercises/file_prune/reference.rs"

[[test]]
name = "file_drain_exercises"
path = "exercises/file_drain/acceptance.rs"

[[test]]
name = "file_drain_reference"
path = "exercises/file_drain/reference.rs"
