name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  LUA_CPP_ORACLE_ROOT: ${{ github.workspace }}\lua_cpp_oracle

jobs:
  quality-gate:
    name: Quality Gate (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned C++ oracle
        uses: actions/checkout@v4
        with:
          repository: YanqingXu/lua
          ref: 87c15e69ceb94eb74e28226ccbefb7e196635711
          path: lua_cpp_oracle
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Environment check
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/rust_env_check.ps1

      - name: M0 compatibility gate
        if: always()
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File tools/m0_compatibility_gate.ps1
          -CppRoot "$env:LUA_CPP_ORACLE_ROOT"

      - name: Enforce oracle baseline-change policy
        if: always() && github.event_name == 'pull_request'
        shell: powershell
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File tools/check_oracle_change.ps1
          -BaseRef "${{ github.base_ref }}"
          -Labels "$env:PR_LABELS"
          -ResultPath target/compatibility/oracle-change.json

      - name: Test official source runner contracts
        if: always()
        shell: powershell
        run: py -3 -m unittest discover -s tools/tests -p test_official_suite_lane.py -v

      - name: Enforce verified official source cases
        if: always()
        shell: powershell
        run: >-
          py -3 tools/run_official_suite.py
          --rust target/x86_64-pc-windows-msvc/debug/lua_app.exe
          --official target/oracles/lua-5.1.5/build/Release/lua51.exe
          --cpp target/oracles/lua_cpp/build/Release/lua_app.exe
          --case constructs.lua --case literals.lua --case locals.lua
          --case math.lua --case nextvar.lua --case pm.lua
          --case strings.lua --case vararg.lua
          --artifact target/compatibility/official-source-required.json

      - name: M1 foundation and quality gate
        if: always()
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File tools/m1_foundation_gate.ps1
          -CppRoot "$env:LUA_CPP_ORACLE_ROOT"

      - name: Upload compatibility metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-metadata
          path: |
            target/compatibility/*.json
            target/compatibility/**/*.json
          if-no-files-found: error

  m1-miri:
    name: M1 Unsafe Durability (Miri)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pinned nightly with Miri
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-29
          components: miri, rust-src

      - name: Run allocator failure matrix under Miri
        run: >-
          cargo +nightly-2026-07-29 miri test
          -p lua_core --test allocator_failure

      - name: Run Runtime lifecycle soak under Miri
        run: >-
          cargo +nightly-2026-07-29 miri test
          -p lua_vm --test runtime_durability

      - name: Run public Runtime access contracts under Miri
        run: >-
          cargo +nightly-2026-07-29 miri test
          -p lua_vm --test runtime_access_contract

      - name: Run managed payload mutation contracts under Miri
        run: >-
          cargo +nightly-2026-07-29 miri test
          -p lua_core --test gc_write_contract

      - name: Run deleted table key lifetimes under Miri
        run: >-
          cargo +nightly-2026-07-29 miri test
          -p lua_core --lib
          table::tests::deleted_gc_key_tombstones_do_not_retain_or_dereference_collected_objects

      - name: Run source and native library lifecycle under Miri
        run: >-
          cargo +nightly-2026-07-29 miri test
          -p lua_stdlib --test runtime_gc_boundary

      - name: Reject untyped IO userdata under Miri
        run: >-
          cargo +nightly-2026-07-29 miri test
          -p lua_stdlib --lib
          file_access_rejects_untyped_userdata_even_with_a_file_metatable

  m1-miri-gc-semantics:
    name: M1 GC and Native Stack (Miri)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pinned nightly with Miri
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-29
          components: miri, rust-src

      - name: Run automatic GC and native stack contracts under Miri
        run: >-
          cargo +nightly-2026-07-29 miri test
          -p lua_stdlib --test gc_semantics

  m1-asan:
    name: M1 Unsafe Durability (Linux ASan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -Zsanitizer=address
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pinned nightly with rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-29
          components: rust-src

      - name: Run allocator failure matrix under ASan
        run: >-
          cargo +nightly-2026-07-29 test
          -Zbuild-std
          --target x86_64-unknown-linux-gnu
          -p lua_core --test allocator_failure

      - name: Run Runtime lifecycle soak under ASan
        run: >-
          cargo +nightly-2026-07-29 test
          -Zbuild-std
          --target x86_64-unknown-linux-gnu
          -p lua_vm --test runtime_durability
