[package]
name = "lua-fixture-runner"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Process-level differential runner for lua_rust Lua fixtures"

# Keep this developer tool independent from the product workspace. This avoids
# changing the workspace quality gate merely by running compatibility reports.
[workspace]

[[bin]]
name = "lua-fixture-runner"
path = "src/main.rs"

[dependencies]
command-group = "5.0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
